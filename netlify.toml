[build]
  publish = "."

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

# SERVICES HOMEPAGE REDIRECT
[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301
  force = true

[[redirects]]
  from = "/services/"
  to = "/#services"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/#services"
  status = 301
  force = true
